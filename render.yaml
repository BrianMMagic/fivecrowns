# One-click deploy config for Render. Point Render at this repo and it reads
# this file - there is nothing to build, the app just needs to be run.
services:
  - type: web
    name: fivecrowns
    runtime: node
    plan: free
    buildCommand: "echo 'no build step - there are no dependencies'"
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
